# Deploys the Notes backend as notes.matsuo.pl — its own compose project on the shared external
# `podman` network (nginx-proxy + acme-companion route it and issue TLS). Serves the app UI + the
# /api endpoints; per-user data persists in H2 on the notes-db volume.
services:
  notes:
    image: ghcr.io/tunguski/elm-single-file-apps/notes-server:latest
    container_name: notes
    restart: always
    environment:
      - VIRTUAL_HOST=notes.matsuo.pl
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=notes.matsuo.pl
      - LETSENCRYPT_EMAIL=admin@matsuo.pl
      - DB_URL=jdbc:h2:file:/app/db/notes
    volumes:
      - notes-db:/app/db
    networks:
      - podman

volumes:
  notes-db:

networks:
  podman:
    name: podman
    external: true
