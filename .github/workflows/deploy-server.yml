name: Build & publish the Sudoku backend image

# Bundles server/SudokuServer.elm into a standalone executable JAR (via the elm-lang compiler) and
# publishes a container image to GHCR. The VPS's containers/matsuo/docker-compose.yml (in the
# projects-aggregator repo) runs that image as the `sudoku` service behind nginx-proxy, which routes
# https://sudoku.matsuo.pl to it and issues the TLS cert automatically.

on:
  push:
    branches: [master, main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out elm-single-file-apps
        uses: actions/checkout@v4

      - name: Check out the elm-lang compiler
        uses: actions/checkout@v4
        with:
          repository: tunguski/elm-lang
          ref: master
          path: elm-lang

      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          cache: "maven"
          cache-dependency-path: elm-lang/pom.xml

      - name: Build the elm compiler (elm.jar)
        working-directory: elm-lang
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean package -DskipTests

      - name: Bundle the server into a standalone jar
        run: |
          java -jar elm-lang/target/elm.jar bundle server \
            server/SudokuServer.elm --port 8080 -o server/sudoku
          ls -la server/sudoku.jar

      - name: Set up Docker Buildx
        # The default `docker` driver can't export to the GHA cache backend used below; buildx
        # provisions a `docker-container` driver builder that can.
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/sudoku-server" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=sudoku-server
          cache-to: type=gha,scope=sudoku-server,mode=max

  # Deploy the Sudoku backend as its OWN compose project on the VPS — the whole deployment
  # (server/docker-compose.yml) lives in this repo, independent of projects-aggregator. It joins the
  # shared external `podman` network, so nginx-proxy + acme-companion route sudoku.matsuo.pl and
  # issue its cert automatically. Needs VPS_USER / VPS_SSH_KEY secrets on THIS repo (same values the
  # projects-aggregator repo uses).
  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out (for the compose file)
        uses: actions/checkout@v4

      - name: Encode the compose file for transport
        # Carried into the remote script via ssh-action's `envs` and decoded there — this keeps the
        # deploy to the SINGLE appleboy/ssh-action the working projects-aggregator deploy uses (same
        # host + VPS_USER/VPS_SSH_KEY secrets), with no second action to authenticate.
        run: echo "COMPOSE_B64=$(base64 -w0 server/docker-compose.yml)" >> "$GITHUB_ENV"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: vps-7d690b64.vps.ovh.net
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: COMPOSE_B64
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            mkdir -p ~/elm-single-file-apps
            echo "$COMPOSE_B64" | base64 -d > ~/elm-single-file-apps/docker-compose.yml
            # Free the container name in case an earlier deploy still owns a container called `sudoku`.
            podman rm -f sudoku 2>/dev/null || true
            cd ~/elm-single-file-apps
            podman pull ghcr.io/tunguski/elm-single-file-apps/sudoku-server:latest
            podman compose up -d --force-recreate
