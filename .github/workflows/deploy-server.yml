name: Build & publish the Sudoku backend image

# Bundles server/SudokuServer.elm into a standalone executable JAR (via the elm-lang compiler) and
# publishes a container image to GHCR. The VPS's containers/matsuo/docker-compose.yml (in the
# projects-aggregator repo) runs that image as the `sudoku` service behind nginx-proxy, which routes
# https://sudoku.matsuo.pl to it and issues the TLS cert automatically.

on:
  push:
    branches: [master, main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out elm-single-file-apps
        uses: actions/checkout@v4

      - name: Check out the elm-lang compiler
        uses: actions/checkout@v4
        with:
          repository: tunguski/elm-lang
          ref: master
          path: elm-lang

      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          cache: "maven"
          cache-dependency-path: elm-lang/pom.xml

      - name: Build the elm compiler (elm.jar)
        working-directory: elm-lang
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean package -DskipTests

      - name: Bundle the server into a standalone jar
        run: |
          java -jar elm-lang/target/elm.jar bundle server \
            server/SudokuServer.elm --port 8080 -o server/sudoku
          ls -la server/sudoku.jar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/sudoku-server" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=sudoku-server
          cache-to: type=gha,scope=sudoku-server,mode=max
