name: Build & deploy the Calendar backend (calendar.matsuo.pl)

# Builds elm.jar, compiles the calendar single-file app, bundles servers/calendar/CalendarServer.elm into a standalone
# jar (reads DB_URL for H2, STATIC_DIR to serve the app UI), publishes a container image to GHCR, and
# redeploys it on the VPS behind nginx-proxy. Same pattern as the sudoku deploy.

on:
  push:
    branches: [master, main]
    paths:
      - "servers/calendar/**"
      - "src/**"
      - "shared/**"
      - ".github/workflows/deploy-calendar.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out elm-single-file-apps
        uses: actions/checkout@v4
      - name: Check out the elm-lang compiler
        uses: actions/checkout@v4
        with:
          repository: tunguski/elm-lang
          ref: master
          path: elm-lang
      - name: Set up GraalVM for JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          cache: "maven"
          cache-dependency-path: elm-lang/pom.xml
      - name: Build the elm compiler (elm.jar)
        working-directory: elm-lang
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean package -DskipTests
      - name: Build the calendar app + bundle the server
        run: |
          chmod +x ./build.sh
          ELM="java -jar $GITHUB_WORKSPACE/elm-lang/target/elm.jar" ./build.sh calendar
          cp build/calendar.html servers/calendar/index.html
          java -jar elm-lang/target/elm.jar bundle server             "$PWD/servers/calendar/CalendarServer.elm" --port 8080 -o servers/calendar/server
          ls -la servers/calendar/server.jar servers/calendar/index.html
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/calendar-server" >> "$GITHUB_OUTPUT"
      - name: Build and push the image
        uses: docker/build-push-action@v5
        with:
          context: servers/calendar
          file: servers/calendar/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=calendar-server
          cache-to: type=gha,scope=calendar-server,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out (for the compose file)
        uses: actions/checkout@v4
      - name: Encode the compose file for transport
        run: echo "COMPOSE_B64=$(base64 -w0 servers/calendar/docker-compose.yml)" >> "$GITHUB_ENV"
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: vps-7d690b64.vps.ovh.net
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: COMPOSE_B64
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
            mkdir -p ~/containers/elm-single-file-apps/calendar-server
            echo "$COMPOSE_B64" | base64 -d > ~/containers/elm-single-file-apps/calendar-server/docker-compose.yml
            podman rm -f calendar 2>/dev/null || true
            cd ~/containers/elm-single-file-apps/calendar-server
            podman pull ghcr.io/tunguski/elm-single-file-apps/calendar-server:latest
            # Pin the project name so the H2 named volume (calendar-server_calendar-db) is stable regardless of the compose folder.
            podman compose -p calendar-server up -d --force-recreate
